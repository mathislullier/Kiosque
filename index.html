@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<script>
(function(){
var dataEl=document.getElementById('data');
var state=JSON.parse(dataEl.textContent);
var app=document.getElementById('app');
var view='shop',filter='all',cart={},owner=false,dirty=false,note='',delId=null,draft=null,busy=false;
var customer={name:'',room:''};
var slot=null;
var DAYS=['dimanche','lundi','mardi','mercredi','jeudi','vendredi','samedi'];
var MONTHS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
function hm(x){return x.replace(':00','h').replace(':','h')}
function schedLines(){
  var d=state.delivery||{},order=[1,2,3,4,5,6,0],groups=[];
  order.forEach(function(k,idx){
    var v=d[k];if(!v)return;
    var g=groups[groups.length-1];
    if(g&&g.cut===v.cut&&g.from===v.from&&g.last===order[idx-1])g.last=k;
    else groups.push({first:k,last:k,cut:v.cut,from:v.from});
  });
  return groups.map(function(g){
    var n=g.first===g.last?DAYS[g.first]:DAYS[g.first]+' au '+DAYS[g.last];
    return n.charAt(0).toUpperCase()+n.slice(1)+' : commande avant '+hm(g.cut)+', livraison le soir même dès '+hm(g.from)+'.';
  });
}
function slots(n){
  var d=state.delivery||{},out=[],now=new Date();
  for(var i=0;i<21&&out.length<n;i++){
    var day=new Date(now.getFullYear(),now.getMonth(),now.getDate()+i);
    var v=d[day.getDay()];if(!v)continue;
    if(i===0){var c=v.cut.split(':');var cut=new Date(day.getTime());cut.setHours(+c[0],+c[1],0,0);if(now>=cut)continue;}
    var key=day.getFullYear()+'-'+(day.getMonth()+1)+'-'+day.getDate();
    var when=DAYS[day.getDay()]+' '+day.getDate()+' '+MONTHS[day.getMonth()];
    var pre=i===0?'Ce soir, ':i===1?'Demain, ':'';
    var lab=pre+(pre?when:when.charAt(0).toUpperCase()+when.slice(1))+', dès '+hm(v.from);
    out.push({key:key,label:lab});
  }
  return out;
}
function slotLabel(){
  var f=slots(8).filter(function(x){return x.key===slot})[0];
  return f?f.label:'';
}
var money=function(n){return n.toFixed(2)};
var price=function(i){return i.s?(i.sp!=null?i.sp:i.p):i.p};
function h(tag,props){
  var e=document.createElement(tag);
  props=props||{};
  Object.keys(props).forEach(function(k){
    var v=props[k];
    if(k==='class')e.className=v;
    else if(k.indexOf('on')===0)e.addEventListener(k.slice(2),v);
    else if(k==='value'||k==='checked'||k==='disabled'||k==='readOnly')e[k]=v;
    else if(v!==false&&v!=null)e.setAttribute(k,v);
  });
  for(var i=2;i<arguments.length;i++){
    var kids=[].concat(arguments[i]);
    kids.forEach(function(c){
      if(c==null||c===false)return;
      e.append(c.nodeType?c:document.createTextNode(String(c)));
    });
  }
  return e;
}
function lines(){
  return state.items.filter(function(i){return cart[i.id]>0}).map(function(i){return {it:i,q:cart[i.id],sum:price(i)*cart[i.id]}});
}
function totals(){
  var s=0,o=0,n=0;
  lines().forEach(function(l){n+=l.q;if(l.it.s)s+=l.sum;else o+=l.sum});
  var f=o>0?(state.fee||0):0;return {stock:s,order:o,fee:f,count:n,total:s+o+f};
}
function setQty(id,d){

}
function chip(val,label){
  return h('button',{class:'chip','aria-pressed':String(filter===val),onclick:function(){filter=val;render()}},label);
}
function thumbOf(it){
  return it.img?h('img',{class:'thumb',src:it.img,alt:'',width:'52',height:'52'}):h('div',{class:'thumb','aria-hidden':'true'},it.n.charAt(0));
}

        h('span',{class:'qty'},q),
        h('button',{class:'sq','aria-label':'Ajouter un '+it.n,onclick:function(){setQty(it.id,1)}},'+'))
    :h('button',{class:'btn alt','aria-label':'Ajouter '+it.n,onclick:function(){setQty(it.id,1)}},'Ajouter');
  return h('div',{class:'row'},thumbOf(it),
    h('div',{},h('div',{class:'name'},it.n),
      h('div',{class:'meta'},it.s?h('span',{class:'st'},'En stock'):'Sur commande',' · ',money(price(it)),' CHF')),
    ctl);
}
function contact(){
  return h('p',{class:'foot'},'Une question ou un article à proposer ? Écris-moi sur Snapchat : ',
    h('a',{href:'https://www.snapchat.com/add/'+state.snap,target:'_blank',rel:'noopener'},state.snap),
    ' ou par mail : ',h('a',{href:'mailto:'+state.email},state.email),'.');
}
function header(){
  return h('header',{},
    h('div',{class:'top'},h('h1',{},state.title),
      owner?h('button',{class:'btn alt small',onclick:function(){view='admin';draft=null;note='';render()}},'Gérer'):null),
    h('p',{class:'sub'},state.tagline),
    h('div',{class:'rules'},h('div',{style:'font-weight:700;margin-bottom:6px'},'Phase de test pendant 2 à 3 semaines. Selon la demande, je continue ou j’arrête.'),schedLines().map(function(x){return h('div',{},x)}),h('div',{},'Frais de livraison : '+money(state.fee)+' CHF par commande. Je vais au Leclerc dès que les commandes payées du jour atteignent '+state.threshold+' CHF. Sinon, ta commande est reportée au jour de livraison suivant, sans frais en plus.'),h('div',{},'Après l’heure limite, c’est aussi le jour suivant. Pas de livraison le vendredi ni le week-end.'),h('div',{style:'margin-top:6px;font-weight:700'},'Paiement par TWINT au '+state.twint+' au moment de la commande, avant l’heure limite. Commande non payée = commande annulée.'),h('div',{},'Articles en stock : paiement sur place, TWINT ou cash.'),h('div',{style:'margin-top:6px'},'Minimum '+money(state.min)+' CHF pour la partie sur commande. Pas de minimum pour les articles en stock.')));
}
function shopView(){
  var w=h('div',{class:'wrap'});
  w.append(header());
  var st=state.items.filter(function(i){return i.s});
  if(st.length){
    w.append(h('h2',{},'Dispo tout de suite'),h('p',{class:'sub'},'En stock chez moi. Passe me voir pour le récupérer.'));
    st.forEach(function(i){w.append(row(i))});
  }
  var rest=state.items.filter(function(i){return !i.s});
  var present=state.cats.filter(function(c){return rest.some(function(i){return i.c===c})});
  if(filter!=='all'&&present.indexOf(filter)<0)filter='all';
  w.append(h('h2',{},'Sur commande'),h('p',{class:'sub'},'Livré le soir, du lundi au jeudi, selon les horaires ci-dessus.'));
  w.append(h('div',{class:'chips'},chip('all','Tout'),present.map(function(c){return chip(c,c)})));
  var list=rest.filter(function(i){return filter==='all'||i.c===filter});
  if(!list.length)w.append(h('p',{class:'sub'},'Aucun article pour le moment.'));
  list.forEach(function(i){w.append(row(i))});
  w.append(contact());
  return w;
}
function bar(){
  var t=totals();
  if(!t.count)return null;
  return h('div',{class:'bar'},
    h('div',{class:'tot'},t.count+(t.count>1?' articles':' article')+' · '+money(t.total)+' CHF'),
    h('button',{class:'btn',onclick:function(){view='cart';render();window.scrollTo(0,0)}},'Voir ma commande'));
}
function orderText(){
  var L=lines();
  var st=L.filter(function(l){return l.it.s});
  var od=L.filter(function(l){return !l.it.s});

  var out=['Salut, voici ma commande.','Nom : '+customer.name.trim(),'Chambre : '+customer.room.trim()];if(od.length){out.push('Livraison : '+slotLabel());out.push('Payé par TWINT au '+state.twint+' : '+money(t.order+t.fee)+' CHF (dont '+money(t.fee)+' de frais de livraison)');}out.push('');
  if(st.length){out.push('Dispo tout de suite (je passe les chercher) :');st.forEach(function(l){out.push('- '+l.q+' x '+l.it.n+' ('+money(l.sum)+')')});out.push('')}

  return out.join('\n');
}
function openUrl(u){

  if(!w)window.location.href=u;
}
function cartView(){
  var w=h('div',{class:'wrap'});

    h('h1',{style:'margin-top:18px'},'Ma commande'));

  var S=t.order>0?slots(4):[];

    var ssel=h('select',{id:'cslot',onchange:function(e){slot=e.target.value;refresh()}},S.map(function(x){return h('option',{value:x.key},x.label)}));
    if(slot)ssel.value=slot;
    w.append(h('label',{for:'cslot'},'Quand veux-tu être livré ?'),ssel,h('p',{class:'note'},'Pour les articles sur commande. Je livre à l’internat à partir de l’heure indiquée, si le seuil de commandes du jour est atteint. Sinon, c’est le jour suivant.'));
  }
  var nameIn=h('input',{type:'text',id:'cname',value:customer.name,autocomplete:'given-name',oninput:function(e){customer.name=e.target.value;refresh()}});
  var roomIn=h('input',{type:'text',id:'croom',value:customer.room,oninput:function(e){customer.room=e.target.value;refresh()}});
  w.append(h('label',{for:'cname'},'Ton prénom'),nameIn,h('label',{for:'croom'},'Ta chambre'),roomIn);
  var ta=h('textarea',{id:'otext',readOnly:true,'aria-label':'Texte de la commande'});
  var hint=h('p',{class:'note'},'');
  var mailBtn=h('button',{class:'btn',onclick:function(){
    openUrl('mailto:'+state.email+'?subject='+encodeURIComponent('Commande kiosque')+'&body='+encodeURIComponent(orderText()));
  }},'Envoyer par e-mail');
  var copyBtn=h('button',{class:'btn alt',onclick:function(){
    var txt=orderText();
    var done=function(){hint.textContent='Commande copiée. Colle-la dans Snapchat.'};
    var fallback=function(){ta.focus();ta.select();try{document.execCommand('copy');done()}catch(e){hint.textContent='Appuie longuement sur le texte pour le copier.'}};
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fallback)}else fallback();
  }},'Copier la commande');
  var snap=h('a',{class:'btn alt',href:'https://www.snapchat.com/add/'+state.snap,target:'_blank',rel:'noopener'},'Ouvrir Snapchat');
  function refresh(){
    var ok=!missing&&customer.name.trim()&&customer.room.trim()&&(t.order===0||slot);
    mailBtn.disabled=!ok;copyBtn.disabled=!ok;
    ta.value=ok?orderText():'';
    if(!ok&&!missing)hint.textContent='Écris ton prénom et ta chambre pour envoyer ta commande.';
    else if(!ok)hint.textContent='';
    else hint.textContent='Envoie-la par e-mail, ou copie-la et colle-la dans Snapchat.';
  }
  w.append(h('label',{for:'otext'},'Ta commande'),ta,h('div',{class:'acts'},mailBtn,copyBtn,snap),hint);
  if(t.order>0)w.append(h('div',{class:'box',style:'border:2px solid var(--green)'},h('strong',{},'Paiement : '),'envoie '+money(t.order+t.fee)+' CHF par TWINT au '+state.twint+' avant l’heure limite. Ta commande est validée quand je reçois le paiement.'+(t.stock>0?' Les articles en stock se paient sur place.':'')));
  refresh();
  w.append(contact());
  return w;
}
function shrink(file){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onerror=function(){rej(new Error('Lecture impossible'))};
    fr.onload=function(){
      var im=new Image();
      im.onerror=function(){rej(new Error('Image illisible'))};
      im.onload=function(){
        var S=280,c=document.createElement('canvas');c.width=S;c.height=S;
        var g=c.getContext('2d');
        var m=Math.min(im.width,im.height),sx=(im.width-m)/2,sy=(im.height-m)/2;
        g.fillStyle='#fff';g.fillRect(0,0,S,S);
        g.drawImage(im,sx,sy,m,m,0,0,S,S);
        res(c.toDataURL('image/jpeg',0.78));
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function num(v){var n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:NaN}
function saveDraft(){
  var p=num(draft.p);
  if(!draft.n.trim()){note='Donne un nom à l’article.';render();return;}
  if(!(p>0)){note='Indique un prix valide.';render();return;}
  var sp=draft.s?num(draft.sp):NaN;
  var item={id:draft.id||('i'+Date.now()),n:draft.n.trim(),p:Math.round(p*20)/20,sp:isFinite(sp)&&sp>0?Math.round(sp*20)/20:Math.round((p+0.3)*20)/20,c:draft.c,s:!!draft.s};
  if(draft.img)item.img=draft.img;
  var idx=state.items.findIndex(function(i){return i.id===item.id});
  if(idx>=0)state.items[idx]=item;else state.items.unshift(item);
  draft=null;dirty=true;note='Article enregistré. Pense à publier les changements.';
  render();
}
async function publishNow(){
  var c=window.claude;
  busy=true;note='';render();
  try{
    var art=c&&c.use?await c.use('artifact'):null;
    if(!art)throw new Error('Publication indisponible ici. Ouvre la page depuis ton compte.');
    var clone=document.documentElement.cloneNode(true);
    clone.querySelector('#data').textContent=JSON.stringify(state).replace(/</g,'\\u003c');
    clone.querySelector('#app').textContent='';
    await art.publish('<!doctype html>\n'+clone.outerHTML);
    dirty=false;note='Publié.';
  }catch(e){
    note='Publication impossible : '+((e&&(e.message||e.code))||'erreur');
  }
  busy=false;render();
}
function adminView(){
  var w=h('div',{class:'wrap'});
  w.append(h('button',{class:'btn alt small',onclick:function(){view='shop';render()}},'Retour au site'),
    h('h1',{style:'margin-top:18px'},'Gérer le catalogue'),
    h('p',{class:'sub'},'Tes changements ne sont visibles par les autres qu’après avoir publié.'),
    h('div',{class:'acts'},h('button',{class:'btn',disabled:!dirty||busy,onclick:publishNow},busy?'Publication…':'Publier les changements'),
      draft?null:h('button',{class:'btn alt',onclick:function(){draft={n:'',p:'',sp:'',c:state.cats[0],s:false,img:null};note='';render()}},'Ajouter un article')));
  if(note)w.append(h('p',{class:'note',role:'status'},note));
  if(draft){
    var f=h('div',{class:'box'});
    f.append(h('label',{for:'dn'},'Nom'),h('input',{type:'text',id:'dn',value:draft.n,oninput:function(e){draft.n=e.target.value}}));
    f.append(h('label',{for:'dp'},'Prix sur commande (CHF)'),h('input',{type:'text',id:'dp',inputmode:'decimal',value:draft.p,oninput:function(e){draft.p=e.target.value}}));
    var sel=h('select',{id:'dc',onchange:function(e){draft.c=e.target.value}},state.cats.map(function(c){return h('option',{value:c},c)}));
    sel.value=draft.c;
    f.append(h('label',{for:'dc'},'Catégorie'),sel);
    f.append(h('label',{class:'cb'},h('input',{type:'checkbox',checked:!!draft.s,onchange:function(e){draft.s=e.target.checked;if(draft.s&&!draft.sp)draft.sp=String(Math.round((num(draft.p)+0.3)*20)/20||'');render()}}),'Disponible directement (en stock)'));
    if(draft.s)f.append(h('label',{for:'ds'},'Prix en stock (CHF)'),h('input',{type:'text',id:'ds',inputmode:'decimal',value:draft.sp,oninput:function(e){draft.sp=e.target.value}}));
    f.append(h('label',{for:'dimg'},'Photo'),h('input',{type:'file',id:'dimg',accept:'image/*',onchange:function(e){
      var file=e.target.files[0];if(!file)return;
      shrink(file).then(function(d){draft.img=d;render()},function(err){note=err.message;render()});
    }}));
    if(draft.img)f.append(h('img',{class:'preview',src:draft.img,alt:'Aperçu'}),h('div',{class:'acts'},h('button',{class:'btn alt small',onclick:function(){draft.img=null;render()}},'Retirer la photo')));
    f.append(h('div',{class:'acts'},h('button',{class:'btn',onclick:saveDraft},'Enregistrer l’article'),h('button',{class:'btn alt',onclick:function(){draft=null;note='';render()}},'Annuler')));
    w.append(f);
  }
  w.append(h('h2',{},'Articles ('+state.items.length+')'));
  state.cats.forEach(function(c){
    var L=state.items.filter(function(i){return i.c===c});
    if(!L.length)return;
    w.append(h('h2',{style:'font-size:18px;color:var(--muted)'},c));
    L.forEach(function(it){
      w.append(h('div',{class:'arow'},
        h('div',{class:'row',style:'border:0;padding:0'},thumbOf(it),
          h('div',{},h('div',{class:'name'},it.n),h('div',{class:'meta'},money(it.p)+' CHF sur commande'+(it.s?' · en stock '+money(it.sp!=null?it.sp:it.p)+' CHF':'')))),
        h('div',{class:'acts'},
          h('button',{class:'btn alt small',onclick:function(){draft={id:it.id,n:it.n,p:String(it.p),sp:String(it.sp!=null?it.sp:''),c:it.c,s:it.s,img:it.img||null};note='';render();window.scrollTo(0,0)}},'Modifier'),
          h('button',{class:'btn alt small','aria-pressed':String(!!it.s),onclick:function(){it.s=!it.s;dirty=true;render()}},it.s?'En stock : oui':'En stock : non'),
          delId===it.id
            ?[h('button',{class:'btn small',onclick:function(){state.items=state.items.filter(function(x){return x.id!==it.id});delete cart[it.id];delId=null;dirty=true;render()}},'Confirmer la suppression'),h('button',{class:'btn alt small',onclick:function(){delId=null;render()}},'Annuler')]
            :h('button',{class:'btn alt small',onclick:function(){delId=it.id;render()}},'Supprimer'))));
    });
  });
  return w;
}
function render(){
  var y=window.scrollY;
  app.textContent='';
  if(view==='admin'&&!owner)view='shop';
  app.append(view==='cart'?cartView():view==='admin'?adminView():shopView());
  if(view==='shop'){var b=bar();if(b)app.append(b)}
  window.scrollTo(0,y);
}
render();
(async function(){
  try{
    var c=window.claude;
    if(!c||!c.use)return;
    var u=await c.use('user');
    if(u&&(u.isOwner()||u.canEdit())){owner=true;render()}
  }catch(e){}
})();
})();
</script>
